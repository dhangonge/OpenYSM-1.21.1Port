    /*
    // cannot implementation due to unknown reason.
    implementation (jarJar("com.github.OpenYSM:ImageStream:-SNAPSHOT")){
        version { prefer "-SNAPSHOT" }
    }
     */
    // using local jar instead.
    implementation(files("libs/ImageStream--SNAPSHOT.jar"))
    localRunRuntime(files("libs/ImageStream--SNAPSHOT.jar"))
    jarJar(files("libs/ImageStream--SNAPSHOT.jar"))
    jarJar("commons-codec:commons-codec:1.16.0")

    implementation(jarJar("io.github.llamalad7:mixinextras-neoforge:0.3.6")) {
