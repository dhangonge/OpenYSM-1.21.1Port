tasks.jarJar.configure {
    archiveClassifier = ''
}

tasks.register('compileNative') {
    if (true) { // TODO
        return false
    }
    def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    def isWindows = osName.contains("win")
    def isLinux = osName.contains("linux")
    def isMac = osName.contains("mac")
    def isCI = System.getenv("GITHUB_ACTIONS") == "true"

    def generatedBase = file("src/generated/resources/META-INF/native")
    def cmake = isWindows ? "cmake.exe" : "cmake"
    if (!isCI && isMac) cmake = "/opt/local/bin/cmake"

    inputs.dir("src/main/native")
    outputs.dir(generatedBase)

    onlyIf {
        try {
            return [cmake, "--version"].execute().waitFor() == 0
        } catch (ignored) {
            println "CMake not found."
            return false
        }
    }

    doLast {
        def configs
        if (isWindows) configs = [[arch: "x64", folder: "windows-x64"], [arch: "Win32", folder: "windows-x86"]]
        else if (isMac) configs = [[arch: "x86_64", folder: "macos-x64"], [arch: "arm64", folder: "macos-arm64"]]
        else if (isLinux) configs = [[arch: "x64", folder: "linux-x64"]]
        else configs = []

        def libName = isWindows ? "ysm-core.dll" : (isMac ? "libysm-core.dylib" : "libysm-core.so")

        configs.each { conf ->
            def buildDir = file("${project.buildDir}/cmake-temp/${conf.folder}")
            def targetDir = file("${generatedBase}/${conf.folder}")
            buildDir.mkdirs()

            def configArgs = [cmake, "-S", projectDir.absolutePath, "-B", buildDir.absolutePath, "-DCMAKE_BUILD_TYPE=Release"]
            if (isWindows) {
                if (isCI) configArgs += ["-G", "Visual Studio 17 2022"]
                configArgs += ["-A", conf.arch]
            } else if (isMac) {
                configArgs += "-DCMAKE_OSX_ARCHITECTURES=${conf.arch}"
            }
            exec { commandLine configArgs }

            exec { commandLine cmake, "--build", buildDir.absolutePath, "--config", "Release" }

            def builtFile = isWindows ? file("${buildDir}/Release/${libName}") : file("${buildDir}/${libName}")
            if (!builtFile.exists()) throw new GradleException("File not found: ${builtFile}")

            targetDir.mkdirs()
            copy {
                from builtFile
                into targetDir
            }
        }
    }
}

processResources.dependsOn compileNative

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '500' << '-Xlint:deprecation' << '-Xlint:unchecked'
}

/*
jarJar at current version has a bug that causes it to fail on Java 21 when repackaging some dependencies (e.g. ImageStream), so we need to bypass jarJar to avoid dependencies build failure.
If you aren't using Java 21, you can just run `./gradlew jarJar` to get a server jar with dependencies repackaged by jarJar, which is more compatible with older Java versions. The 'serverjar' task is meant to be a workaround for Java 21 users until jarJar is updated to support it.
 */
tasks.register('serverjar') {
    group = 'build'
    description = 'Builds a server-ready jar with bundled dependencies (jar-in-jar)'
    dependsOn tasks.named('jar')

    def imageStreamJar = file('libs/ImageStream--SNAPSHOT.jar')
    def commonCodecJar = configurations.runtimeClasspath.resolve().find { it.name.startsWith('commons-codec') && it.name.endsWith('.jar') }

    doLast {
        def jarTask = tasks.named('jar', Jar).get()
        def sourceJar = jarTask.archiveFile.get().asFile
        def destDir = layout.buildDirectory.dir('libs').get().asFile
        def serverJar = new File(destDir, "${base.archivesName.get()}-${project.version}-server.jar")
        def mergedDir = new File(layout.buildDirectory.get().asFile, 'tmp/serverjar/merged')
        def repackDir = new File(layout.buildDirectory.get().asFile, 'tmp/serverjar/repack')

        delete mergedDir
        delete repackDir
        mergedDir.mkdirs()
        repackDir.mkdirs()

        // expand main jar
        copy {
            from zipTree(sourceJar)
            into mergedDir
        }

        // expand ImageStream
        if (imageStreamJar.exists()) {
            copy {
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
                from zipTree(imageStreamJar)
                into mergedDir
            }
        }

        if (commonCodecJar.exists()) {
            copy {
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
                from zipTree(commonCodecJar)
                into mergedDir
            }
        }


        // repack (copy to flatten directory structure before ant.jar)
        copy {
            from mergedDir
            into repackDir
        }

        ant.jar(destfile: serverJar, basedir: repackDir)

        delete mergedDir
        delete repackDir

        println "Server jar created: ${serverJar.absolutePath} (${serverJar.length()} bytes)"
    }
}


