plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.27'
}

version = '2.6.5-NeoForge+mc1.21.1'
group = 'com.elfmcys.yesstevemodel'

sourceSets.main.resources { srcDir 'src/generated/resources' }

base {
    archivesName = 'ysm'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    accessTransformers {
        file 'src/main/resources/META-INF/accesstransformer.cfg'
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        jvmArguments '-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowEnhancedClassRedefinition'
        workingDirectory project.file('run/client_a')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'yes_steve_model'
    }

    client2 {
        runType 'client'
        jvmArguments '-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowEnhancedClassRedefinition'
        workingDirectory project.file('run/client_b')
        arguments '--username', 'tartaric_acid'
        systemProperty 'neoforge.enabledGameTestNamespaces', 'yes_steve_model'
    }

    server {
        workingDirectory project.file('run/server')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'yes_steve_model'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    flatDir { dir 'libs' }
    maven { url = uri('https://jitpack.io') }
}

jarJar.enable()

dependencies {
    implementation "net.neoforged:neoforge:21.1.229"

    // compileOnly dependencies from libs/ (optional mod compat)
    compileOnly files('libs/elytraslot-neoforge-9.0.2+1.21.1.jar')
    compileOnly files('libs/firstperson-neoforge-2.7.1-mc1.21.1.jar')
    compileOnly files('libs/immersive_melodies-neoforge-0.6.4+1.21.1.jar')
    compileOnly files('libs/player-animation-lib-2.0.4+1.21.1.jar')
    compileOnly files('libs/touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar')
    // TACZ: no NeoForge official 1.21.1 version
    compileOnly files('libs/tacz-neoforge-1.21.1-1.1.8-r2.jar')
    compileOnly files('libs/carryon-neoforge-1.21.1-2.2.4.4.jar')
    compileOnly files('libs/theoneprobe-1.21_neo-12.0.8.jar')
    compileOnly files('libs/curios-neoforge-9.5.1+1.21.1.jar')
    compileOnly files('libs/sophisticatedcore-1.21.1-1.4.39.1852.jar')
    compileOnly files('libs/sophisticatedbackpacks-1.21.1-3.25.45.1742.jar')
    compileOnly files('libs/cosmeticarmorreworked-1.21.1-v1-neoforge.jar')
    compileOnly files('libs/swem-1.21.1-1.6.9.jar')
    compileOnly files('libs/simpleplanes-1.21.1-5.3.7.jar')
    compileOnly files('libs/irons_spellbooks-1.21.1-3.15.6.jar')
    compileOnly files('libs/ParCool-1.21.1-3.4.3.3-NF.jar')
    compileOnly files('libs/immersive_aircraft-neoforge-1.4.3+1.21.1.jar')
    compileOnly files('libs/bettercombat-neoforge-2.3.2+1.21.1.jar')
    compileOnly files('libs/Jade-1.21.1-NeoForge-15.10.5.jar')
    compileOnly files('libs/superbwarfare-1.21.1-0.8.8-final-neoforge.jar')
    compileOnly files('libs/realcamera-1.21.1-neoforge-0.7.6-beta.jar')
    compileOnly files('libs/SlashBladeResharped-2.0.3-1.21.1.jar')
    // SlashBlade: no NeoForge 1.21.1 version
    // compileOnly files('libs/SlashBlade-1.20.1-0.1.2.jar')
    compileOnly files('libs/neoculus-mc1.21.1-1.8.7.jar')
    compileOnly files('libs/geckolib-neoforge-1.21.1-4.8.4.jar')
    compileOnly files('libs/create-1.21.1-6.0.10.jar')
